<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Model Registry</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 2fr 1fr;
            }
        }

        .card {
            background: var(--surface-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem;
        }

        h1,
        h2 {
            margin-top: 0;
            color: #0f172a;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #334155;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.15s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkbox-group label {
            display: inline-flex;
            align-items: center;
            font-weight: normal;
            margin-bottom: 0.25rem;
            margin-right: 1rem;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 0.5rem;
        }

        #dropzone {
            border: 2px dashed #94a3b8;
            border-radius: var(--radius);
            padding: 3rem 1.5rem;
            text-align: center;
            cursor: pointer;
            margin-top: 1rem;
            background-color: #f1f5f9;
            transition: all 0.2s ease;
        }

        #dropzone:hover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        #dropzone p {
            margin: 0;
            color: #64748b;
            font-size: 0.95rem;
        }

        #dropzone.dragover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        #selectedFile {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: var(--primary-color);
            font-weight: 500;
        }

        button[type="submit"] {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 1.5rem;
            transition: background-color 0.2s ease;
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover);
        }

        #notice {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: var(--radius);
            font-size: 0.9rem;
            display: none;
        }

        .notice-success {
            background-color: #dcfce7;
            color: #166534;
            display: block !important;
        }

        .notice-error {
            background-color: #fee2e2;
            color: #991b1b;
            display: block !important;
        }

        ul#modelList {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ul#modelList li {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .refresh-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--text-color);
            font-weight: 500;
            float: right;
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            background-color: var(--border-color);
        }

        .model-item {
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .model-header {
            background-color: #f1f5f9;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .model-header h3 {
            margin: 0;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .badge {
            background-color: var(--primary-color);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: normal;
        }

        .model-meta {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        .version-list {
            list-style: none;
            margin: 0;
            padding: 0;
            background: white;
        }

        .version-list li {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 1rem;
            align-items: center;
        }

        .version-list li:last-child {
            border-bottom: none;
        }

        .run-id {
            color: #94a3b8;
            font-family: monospace;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Register Model</h1>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="model_name">Model Name *</label>
                    <input type="text" id="model_name" name="model_name" required
                        placeholder="e.g., resnet50_production">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="model_type">Model Type *</label>
                        <select id="model_type" name="model_type" required>
                            <option value="">Select...</option>
                            <option value="Speech">Speech</option>
                            <option value="NER">NER</option>
                            <option value="File Classifier">File Classifier</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="architecture">Architecture</label>
                        <select id="architecture" name="architecture">
                            <option value="">Select...</option>
                            <option value="__ADD_NEW__">+ Add New Architecture</option>
                        </select>
                        <input type="text" id="new_architecture" placeholder="Enter new architecture name" style="display:none; margin-top:0.5rem;" />
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="accuracy">Accuracy *</label>
                        <input type="number" id="accuracy" name="accuracy" min="0" max="100" step="0.01" required
                            placeholder="95">
                    </div>

                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <input type="number" id="priority" name="priority" placeholder="1 (Highest)">
                    </div>
                </div>

                <div class="form-group checkbox-group" id="deployment_points_container" style="display:none;">
                    <label>Deployment Points *</label><br>
                    <div id="deployment_points_list"></div>
                </div>

                <div class="form-group checkbox-group">
                    <label><input type="checkbox" id="is_deployable" name="is_deployable"> <strong>Is Deployable Ready?</strong></label>
                </div>

                <div class="form-group">
                    <label for="versioning">Versioning *</label>
                    <select id="versioning" name="versioning" required>
                        <option value="Auto-increment" selected>Auto-increment (MLflow default)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="remarks">Remarks</label>
                    <textarea id="remarks" name="remarks"
                        placeholder="Any additional notes about this model iteration..."></textarea>
                </div>

                <div id="dropzone" onclick="document.getElementById('fileInput').click()">
                    <p><strong>Click to browse</strong> or drag and drop</p>
                    <p style="font-size: 0.8rem; margin-top: 0.25rem;">Supported formats: .pt, .onnx</p>
                    <input type="file" id="fileInput" name="model" accept=".pt, .onnx" style="display: none;">
                </div>
                <div id="selectedFile"></div>

                <button type="submit">Upload & Register</button>
                <div id="notice"></div>
            </form>
        </div>

        <div class="card" style="align-self: start;">
            <h2>
                Registry Log
                <button type="button" class="refresh-btn" onclick="fetchModels()">Refresh</button>
            </h2>
            <div id="modelList">
                <p style="color: #64748b; font-size: 0.9rem;">Loading models...</p>
            </div>
        </div>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const notice = document.getElementById('notice');
        const modelList = document.getElementById('modelList');
        const uploadForm = document.getElementById('uploadForm');
        const selectedFileDiv = document.getElementById('selectedFile');
        const nameInput = document.getElementById('model_name');
        
        // Architecture Logic
        const architectureSelect = document.getElementById('architecture');
        const newArchInput = document.getElementById('new_architecture');
        
        // Deployment Points Logic
        const modelTypeSelect = document.getElementById('model_type');
        const dpContainer = document.getElementById('deployment_points_container');
        const dpList = document.getElementById('deployment_points_list');
        
        const COMPATIBILITY_RULES = {
            'Speech': ['Cloud App', 'Edge Device'],
            'NER': ['Cloud App'],
            'File Classifier': ['Dashboard', 'Cloud App']
        };

        modelTypeSelect.addEventListener('change', () => {
            const selected = modelTypeSelect.value;
            dpList.innerHTML = '';
            if (selected && COMPATIBILITY_RULES[selected]) {
                dpContainer.style.display = 'block';
                COMPATIBILITY_RULES[selected].forEach(dp => {
                    dpList.innerHTML += `<label><input type="checkbox" name="deployment_points" value="${dp}"> ${dp}</label>`;
                });
            } else {
                dpContainer.style.display = 'none';
            }
        });

        function fetchArchitectures() {
            fetch('/api/architectures/')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        architectureSelect.innerHTML = '<option value="">Select...</option><option value="__ADD_NEW__">+ Add New Architecture</option>';
                        data.architectures.forEach(arch => {
                            const opt = document.createElement('option');
                            opt.value = arch.id;
                            opt.textContent = arch.name;
                            architectureSelect.insertBefore(opt, architectureSelect.lastChild);
                        });
                    }
                });
        }
        
        architectureSelect.addEventListener('change', () => {
            if (architectureSelect.value === '__ADD_NEW__') {
                newArchInput.style.display = 'block';
                newArchInput.required = true;
            } else {
                newArchInput.style.display = 'none';
                newArchInput.required = false;
            }
        });
        
        fetchArchitectures();

        let currentFile = null;

        function setFile(file) {
            currentFile = file;
            if (file) {
                selectedFileDiv.innerText = 'Selected file: ' + file.name;
                if (!nameInput.value) {
                    nameInput.value = file.name.replace(/\.(pt|onnx)$/i, '');
                }
            } else {
                selectedFileDiv.innerText = '';
            }
        }

        dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
        dropzone.addEventListener('dragleave', e => { dropzone.classList.remove('dragover'); });
        dropzone.addEventListener('drop', e => { e.preventDefault(); dropzone.classList.remove('dragover'); setFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', e => { setFile(e.target.files[0]); });

        function showNotice(msg, isSuccess) {
            notice.className = isSuccess ? 'notice-success' : 'notice-error';
            notice.innerText = msg;
        }

        uploadForm.addEventListener('submit', async e => {
            e.preventDefault();
            if (!currentFile) {
                showNotice('Error: Please select a model file (.pt or .onnx).', false);
                return;
            }
            
            // Check deployment points
            if (modelTypeSelect.value && COMPATIBILITY_RULES[modelTypeSelect.value]) {
                const checked = document.querySelectorAll('input[name="deployment_points"]:checked');
                if (checked.length === 0) {
                    showNotice('Error: Please select at least one deployment point.', false);
                    return;
                }
            }

            const btn = uploadForm.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerText = 'Uploading...';
            notice.className = 'notice-success';
            notice.innerText = 'Uploading...';

            let archValue = architectureSelect.value;
            if (archValue === '__ADD_NEW__') {
                try {
                    const archRes = await fetch('/api/architectures/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newArchInput.value })
                    }).then(r => r.json());
                    if (archRes.success) {
                        archValue = archRes.architecture.id;
                    } else {
                        throw new Error(archRes.error);
                    }
                } catch (err) {
                    showNotice('Error creating architecture: ' + err.message, false);
                    btn.disabled = false;
                    btn.innerText = 'Upload & Register';
                    return;
                }
            }

            const formData = new FormData(uploadForm);
            formData.set('model', currentFile);
            if (archValue && archValue !== '__ADD_NEW__') {
                formData.set('architecture', archValue);
            } else {
                formData.delete('architecture');
            }

            fetch('/api/models/register/', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        showNotice('Successfully registered model!', true);
                        fetchModels();
                        fetchArchitectures();
                        uploadForm.reset();
                        setFile(null);
                        newArchInput.style.display = 'none';
                        dpContainer.style.display = 'none';
                    } else {
                        showNotice('Error: ' + data.error, false);
                    }
                })
                .catch(err => {
                    showNotice('Network error uploading file.', false);
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.innerText = 'Upload & Register';
                });
        });

        function fetchModels() {
            const btn = document.querySelector('.refresh-btn');
            if (btn) btn.innerText = 'Refreshing...';

            fetch('/api/models/')
                .then(res => res.json())
                .then(data => {
                    modelList.innerHTML = '';
                    if (data.success && data.models.length > 0) {
                        data.models.forEach(m => {
                            const latest = m.all_versions[0];
                            const framework = (latest && latest.framework) ? latest.framework.toUpperCase() : 'Unknown';
                            const modelType = (latest && latest.model_type) ? latest.model_type : 'Unknown';

                            const modelDiv = document.createElement('div');
                            modelDiv.className = 'model-item';

                            const headerHTML = `
                                <div class="model-header">
                                    <h3>
                                        ${m.name} 
                                        <span class="badge">v${latest.version} (Latest)</span>
                                    </h3>
                                    <div class="model-meta">Framework: <strong>${framework}</strong> | Type: <strong>${modelType}</strong></div>
                                </div>
                            `;

                            let versionsHTML = '<ul class="version-list">';
                            m.all_versions.forEach(v => {
                                versionsHTML += `
                                    <li>
                                        <div><strong>v${v.version}</strong></div>
                                        <div>
                                            <div>Size: ${v.formatted_size} | Accuracy: ${v.accuracy}% | Architecture: ${v.architecture}</div>
                                            <div class="run-id">Deployable: ${v.is_deployable} | Priority: ${v.priority !== null ? v.priority : 'N/A'} | Type: ${v.model_type}</div>
                                            <div class="run-id">Deployment Points: ${(v.deployment_points && v.deployment_points.length > 0) ? v.deployment_points.join(', ') : 'None'}</div>
                                            <div class="run-id">Run ID: ${v.run_id}</div>
                                        </div>
                                    </li>
                                `;
                            });
                            versionsHTML += '</ul>';

                            modelDiv.innerHTML = headerHTML + versionsHTML;
                            modelList.appendChild(modelDiv);
                        });
                    } else {
                        modelList.innerHTML = '<p style="color: #64748b; font-size: 0.9rem;">No models registered yet.</p>';
                    }
                })
                .catch(() => {
                    modelList.innerHTML = '<p style="color: #ef4444; font-size: 0.9rem;">Failed to load registry.</p>';
                })
                .finally(() => {
                    if (btn) btn.innerText = 'Refresh';
                });
        }

        fetchModels();
        // Auto-refresh every 15 seconds so MLflow deletions appear without manual reload
        setInterval(fetchModels, 15000);
    </script>
</body>
</html>
